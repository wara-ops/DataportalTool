[tox]
requires =
    tox>=4
# The envs must stay within requires-python (">=3.11, <3.15") AND within the
# targets of the (git-ignored, local) pdm.lock, or `pdm sync` dies with "No
# compatible lock target found". Regenerate the lock to cover every env with:
#   pdm lock -d --update-reuse --python ">=3.11,<3.15"
env_list = lint, py{311,312,313,314}

[testenv]
description = run unit tests
groups = dev
commands =
    pytest tests {posargs}

[testenv:lint]
description = run linters
groups = dev
commands =
    ruff check
    ruff format --check
    pylint src/dataportaltools
